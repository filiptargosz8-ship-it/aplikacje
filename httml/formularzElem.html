<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <form>
        <label for="name">wpisz imie:</label>
        <input type="text" id="name"><br>

        <label for="password">wpisz haslo:</label>
        <input type="password" id="password"><br>

        <label for="wiek">wpisz wiek:</label>
        <input type="number" id="wiek" min="0" max="120"><br>

        <label for="date_ur">data urodzeniea</label>
        <input type="date" id="date_ur" min="2000-01-01"><br>

        <label for="obraz">obraz jako submit:</label>
        <input type="image" src="imggg.png" id="obraz" width="40" height="30"><br>

        <label for="myfile">wbierz plik</label>
        <input type="file" id="myfile"><br>

        <label for="zakres">volume: od 0</label>
        <input type="rangr" id="zakres" min="0" max="100">100<br>

        <label for="czas">wybierz czas</label>
        <input type="time" id="czas"><br>
    </form>
</body>
</html>
