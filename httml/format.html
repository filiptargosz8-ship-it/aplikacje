<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatowanie elementow</title>
</head>
<body>
    <h1>formatowanie elementow HTML</h1>
    <p>akapit - czyli fragment tekstu</p>
    <b>pogrubienir tkestu </b><strong>strong pogrubienir</strong><br>
    <i>italik wyroznienie tekstu</i><br>
    <u>podkreslenie</u>
    <mark>mark - zakreslenie</mark>
    <small>maly tekst</small>
</body>
</html>
