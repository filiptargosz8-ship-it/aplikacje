<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabel</title>
    <style>
        table,td,th {
            border:1px solid red;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <table width="100%">
        <caption>tytul tablowa</caption>
        <tr><th>LP</th><th colspan="2">imie</th></tr>
        <tr><td rowspan="2">1</td><td>tru adam</td><td>21</td></tr>
        <tr><td>filip</td><td>18</td></tr>
        <tr><td>3</td><td>żądełko</td><td>6,7</td></tr>
    </table>
</body>
</html>
