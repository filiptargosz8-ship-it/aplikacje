<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Listy</title>
</head>
<body>
    <h1>lista nie uporzadkowana</h1>
    <ul style="list-style-type: circle; ;">
        <li>maslo</li>
        <li>mleko</li>
        <li>bulki</li>
    </ul>
    <h1>lista uporzadkowana</h1>
    <ol style="list-style-type: decimal;">
        <li>pierwszy</li>
        <li>drugi</li>
        <li>trzeci</li>
        <li>czwarty</li>
        <li>piaty</li>
    </ol>
    <h1>lista mieszana</h1>
    <ol>
        <li>tea:</li>
            <ul>
                <li>white</li>
                <li>black</li>
                <li>green</li>
            </ul>
        <li>coffee:</li>
            <ul>
                <li>white</li>
                <li>black</li>
            </ul>
    </ol>
</body>
</html>
